
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Geometry — Дополненная реальность</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            overflow: hidden;
        }

        .ar-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            max-width: 430px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 15px;
            border-radius: 12px;
            background: rgba(16, 24, 39, 0.94);
        }

        h2 {
            color: #55c6ff;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
        }

        select,
        input {
            background: #e9f1fa;
            color: #101827;
        }

        button {
            background: #168bd2;
            color: white;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            padding: 12px;
            margin-top: 10px;
            background: #159b72;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        #arStatus {
            padding: 10px;
            background: #263b55;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
        }

        #arResults {
            font-size: 14px;
            line-height: 1.6;
        }

        .ar-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        .a-enter-vr {
            display: none !important;
        }
    </style>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js 3.4.7 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body>

    <div class="ar-panel">

        <h2>AR Geometry</h2>

        <p>
            Наведите камеру на маркер Hiro,
            чтобы увидеть геометрическую фигуру.
        </p>

        <label for="arShape">
            Выберите фигуру
        </label>

        <select id="arShape">
            <option value="cube">Куб</option>
            <option value="sphere">Шар</option>
            <option value="cylinder">Цилиндр</option>
            <option value="cone">Конус</option>
            <option value="pyramid">Пирамида</option>
        </select>

        <div id="arParameters"></div>

        <button id="arCalculate">
            Рассчитать параметры
        </button>

        <div id="arResults">
            Объём: —
            <br>
            Площадь поверхности: —
        </div>

        <p id="arStatus">
            Ожидание запуска камеры...
        </p>

        <a href="index.html" class="home-link">
            Вернуться к 3D-приложению
        </a>

    </div>

    <!-- Сцена дополненной реальности -->

    <a-scene
        id="arScene"
        class="ar-scene"
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Маркер Hiro -->

        <a-marker
            id="hiroMarker"
            preset="hiro"
            emitevents="true"
            smooth="true"
            smoothCount="5">

            <!-- Геометрическая модель -->

            <a-entity
                id="arModel"
                position="0 0.25 0"
                geometry="primitive: box; width: 0.5; height: 0.5; depth: 0.5"
                material="color: #168bd2; metalness: 0.15; roughness: 0.4">
            </a-entity>

        </a-marker>

        <!-- Камера -->

        <a-entity camera></a-entity>

    </a-scene>

    <script src="ar.js"></script>

</body>
</html>
